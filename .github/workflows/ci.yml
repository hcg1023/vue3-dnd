name: CI

on:
  schedule:
    - cron: '0 0 * * *'

  push:
    branches:
      - main
      - changeset-release/main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: ./.github/actions/pnpm

      - name: Run Lint
        run: pnpm run lint

      - name: Run Stylelint
        run: pnpm run stylelint

      - name: Run Prettier
        run: pnpm run prettier

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: ./.github/actions/pnpm

      - name: Run Test
        run: pnpm run test

      - name: Run Build
        run: pnpm -r build
