name: deploy-web

env:
  BASE_URL: /
  BUILD_PACKAGE_NAME: 'docs'
  PUBLISH_DIR: ./packages/docs/dist

# 手动触发，不需要自动部署
# 自动部署的时机是在publish之后
on: workflow_dispatch

permissions:
  contents: write # GitHub Pages 部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        uses: ./.github/actions/deploy-docs
        with:
          build: >-
            BASE_URL=${{ env.BASE_URL }} pnpm -r build
            --filter=${{ env.BUILD_PACKAGE_NAME }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
