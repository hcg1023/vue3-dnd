name: changesets-release

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  BASE_URL: /
  BUILD_PACKAGE_NAME: 'docs'
  PUBLISH_DIR: ./packages/docs/dist

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: write # 发版提交与 GitHub Pages 部署
  pull-requests: write # changesets 版本 PR

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/pnpm

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # https://github.com/changesets/action
        # action v2 要求 Changesets CLI v3；本仓库为 CLI v2，须用 action v1
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run pack-version
          commit: 'chore(changesets): release'
          title: 'Release From Changesets'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post Publish to npm # 发布成功后，可以执行一些事情
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: pnpm run publish-success

      - name: Deploy to GitHub Pages # 发布成功后或无changeset时部署
        if: >-
          ${{ steps.changesets.outputs.published == 'true' ||
          steps.changesets.outputs.hasChangesets == 'false' }}
        uses: ./.github/actions/deploy-docs
        with:
          build: >-
            BASE_URL=${{ env.BASE_URL }} pnpm -r build
            --filter=${{ env.BUILD_PACKAGE_NAME }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
