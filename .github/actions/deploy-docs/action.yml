name: Deploy Docs
description: Deploys the docs to GitHub Pages

inputs:
  build:
    description: 'Command to build the docs'
    required: true
  publish_dir:
    description: 'Directory to publish'
    required: true
  github_token:
    description: 'GitHub token for the deployment'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/pnpm

    - name: build project
      run: ${{ inputs.build }}
      shell: bash

    - name: Run Deploy
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ hashFiles(inputs.publish_dir) }}
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ${{ inputs.publish_dir }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        cname: www.vue3-dnd.com
